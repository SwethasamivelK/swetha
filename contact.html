<style>
:root{
  --bg:#0B0F1A;
  --glass:rgba(255,255,255,0.05);
  --text:#F8FAFC;
  --muted:#94A3B8;
  --gradient:linear-gradient(90deg,#7C3AED,#EC4899,#06B6D4);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:var(--bg);color:var(--text);}
html{scroll-behavior:smooth;}

/* NAVBAR */
nav{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 8%;
  background:rgba(11,15,26,0.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.05);
}
nav strong{
  font-size:20px;
  background:var(--gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
nav a{
  margin-left:25px;
  text-decoration:none;
  color:var(--text);
  transition:0.3s;
}
nav a:hover{color:#EC4899;}

/* HERO */
.hero{
  text-align:center;
  padding:100px 20px 50px;
}
.hero h1{
  font-size:48px;
  font-weight:800;
  background:var(--gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero p{
  margin-top:15px;
  color:var(--muted);
}

/* SECTION */
.section{
  max-width:1100px;
  margin:50px auto;
  padding:50px;
  background:var(--glass);
  backdrop-filter:blur(15px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.05);
}

/* GRID */
.contact-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:40px;
}

/* CONTACT CARDS */
.contact-card{
  background:rgba(255,255,255,0.04);
  padding:25px;
  border-radius:16px;
  text-align:center;
  transition:0.3s;
}
.contact-card:hover{
  transform:translateY(-8px);
  box-shadow:0 10px 30px rgba(124,58,237,0.4);
}
.contact-card i{
  font-size:28px;
  margin-bottom:12px;
  color:#06B6D4;
}
.contact-card p{
  color:var(--muted);
}

/* FORM */
form{
  display:flex;
  flex-direction:column;
}
input, textarea{
  padding:14px;
  margin-bottom:15px;
  border-radius:8px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.08);
  color:white;
}
textarea{resize:none;height:120px;}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:var(--gradient);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}
button:hover{transform:scale(1.05);}

/* MAP */
.map{
  margin-top:40px;
  border-radius:16px;
  overflow:hidden;
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px 20px;
  margin-top:60px;
  border-top:1px solid rgba(255,255,255,0.05);
}
.footer-social a{
  margin:0 10px;
  font-size:20px;
  color:var(--muted);
  transition:0.3s;
}
.footer-social a:hover{color:#EC4899;}

/* WHATSAPP FLOAT */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:50%;
  font-size:22px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
  z-index:1000;
  transition:0.3s;
}
.whatsapp:hover{transform:scale(1.1);}

@media(max-width:768px){
  .hero h1{font-size:36px;}
  nav{flex-direction:column;gap:15px;}
}
</style>
</head>

<body>
